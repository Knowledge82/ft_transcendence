services:
  postgres:
    image: postgres:16-alpine
    container_name: ft_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:? ❌ [FATAL] POSTGRES_USER is missing in your .env file }
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:? ❌ [FATAL] POSTGRES_PASSWORD is missing in your .env file }
      POSTGRES_DB: ${POSTGRES_DB:? ❌ [FATAL] POSTGRES_DB is missing in your .env file }
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - ft_network_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: ft_backend_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:? ❌ [FATAL] JWT_SECRET is missing in your .env file }
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:? ❌ [FATAL] JWT_REFRESH_SECRET is missing in your .env file }
      NODE_ENV: production
      GROQ_API_KEY: ${GROQ_API_KEY:? ❌ [FATAL] GROQ_API_KEY is missing in your .env file }
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      FORTYTWO_CLIENT_ID: ${FORTYTWO_CLIENT_ID:? ❌ [FATAL] FORTYTWO_CLIENT_ID is missing in your .env file }
      FORTYTWO_CLIENT_SECRET: ${FORTYTWO_CLIENT_SECRET:? ❌ [FATAL] FORTYTWO_CLIENT_SECRET is missing in your .env file }
      FORTYTWO_CALLBACK_URL: ${FORTYTWO_CALLBACK_URL:? ❌ [FATAL] FORTYTWO_CALLBACK_URL is missing in your .env file }
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost:8443}
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - ft_network_prod
    expose:
      - "3000"

  frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build
    container_name: ft_frontend_build_prod
    volumes:
      - frontend_dist_prod:/output
    networks:
      - ft_network_prod

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: ft_nginx_prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      frontend-build:
        condition: service_completed_successfully
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/conf.d.prod:/etc/nginx/conf.d
      - ./nginx/certs:/etc/nginx/certs
      - frontend_dist_prod:/usr/share/nginx/html:ro
    networks:
      - ft_network_prod

networks:
  ft_network_prod:
    driver: bridge

volumes:
  postgres_data_prod:
  frontend_dist_prod:
