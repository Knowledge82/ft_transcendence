server {
    listen 80;
    server_name localhost;
    return 301 https://localhost:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate     /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;

    # API REST: idéntico al de desarrollo — el backend no cambia de
    # comportamiento entre entornos, solo cómo se construye su imagen
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
    }

    # WebSocket (Socket.IO) — igual que en desarrollo
    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Archivos estáticos del frontend, servidos directamente por nginx —
    # ya no hay ningún servidor de desarrollo de Vite detrás. Esta es la
    # diferencia clave frente a la configuración de desarrollo.
    location / {
        root /usr/share/nginx/html;

        # Clave para que React Router funcione: una petición directa a,
        # por ejemplo, /celda no corresponde a ningún archivo real en
        # disco (esa ruta solo existe dentro de la aplicación React).
        # try_files intenta encontrar el archivo tal cual, luego como
        # carpeta, y si ninguno existe, cae de vuelta a index.html — la
        # propia aplicación React, ya cargada, es quien reconoce la
        # ruta y decide qué mostrar.
        try_files $uri $uri/ /index.html;

        # Los archivos generados por Vite llevan un hash único en el
        # nombre (p. ej. index-a1b2c3.js) — un nuevo despliegue genera
        # nombres distintos, así que cachear estos archivos de forma
        # agresiva es seguro: nunca habrá una versión vieja sirviéndose
        # por error bajo el mismo nombre
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
